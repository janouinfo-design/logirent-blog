<!DOCTYPE html>
<html lang="fr">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    .article p{color:#64748b;font-size:15px}
    .empty{padding:48px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:8px;color:#64748b}
    footer{margin-top:64px;padding-top:24px;border-top:1px solid #e2e8f0;color:#94a3b8;font-size:14px;text-align:center}
